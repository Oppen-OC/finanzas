name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # The ingestion scenario tests read a real export from data/inbox; the
      # synthetic one exercises the same parser and balance chain.
      - run: uv run python demo/make_exports.py
      - run: uv run python -m unittest
